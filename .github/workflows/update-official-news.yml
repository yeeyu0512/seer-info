name: Refresh official news

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Run automated tests
        run: npm test

      - name: Check JavaScript modules
        run: npm run check

      # A failed fetch stops publication, leaving the live site untouched.
      - name: Fetch Taiwan official announcements
        run: npm run news:refresh

      - uses: actions/configure-pages@v6
      - name: Prepare static website
        run: node tools/prepare-site.mjs _site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - name: Publish refreshed website
        id: deployment
        uses: actions/deploy-pages@v5
