<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>賽爾號玩家查詢｜賽爾號資訊站</title>
    <meta name="description" content="使用 米米號 查詢賽爾號玩家資料。">
    <link rel="icon" href="./favicon.ico" sizes="any">
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/player-lookup.css">
</head>

<body>
    <header class="site-header">
        <div class="header-inner">
            <a href="./index.html" class="logo" aria-label="賽爾號資訊站首頁">
                <img class="logo-mark" src="./favicon.ico" alt="">
                <span>賽爾號資訊站</span>
            </a>
            <a class="player-lookup-back-link" href="./index.html">回到資訊站 ↗</a>
        </div>
    </header>
    <main class="container player-lookup-page">
        <section class="panel player-lookup-card" aria-labelledby="player-lookup-title">
            <header class="panel-header player-lookup-header">
                <div>
                <h1 id="player-lookup-title" class="panel-title">玩家資料查詢</h1>
                <p class="panel-description">輸入米米號，查詢台服玩家的巔峰戰績與出戰、待戰精靈。</p>
            </div></header>

            <div class="player-search-toolbar">
            <form id="player-lookup-form" class="player-lookup-form">
                <label class="field-label" for="mimi-id">米米號</label>
                <div class="player-lookup-input-row">
                    <input id="mimi-id" name="mimi_id" type="text" placeholder="例如：20000001" inputmode="numeric" pattern="[0-9]+"
                        autocomplete="off" required aria-describedby="mimi-id-help">
                    <button id="lookup-submit" class="primary-button compact-button" type="submit">查詢</button>
                </div>
                <small id="mimi-id-help">請輸入半形數字米米號。</small>
            </form>
            <aside class="player-service-status" aria-label="服務狀態">
                <div class="service-indicator"><span class="service-label">查詢服務</span><strong id="api-health" data-state="pending">檢查中</strong><small>必須為正常才可以查詢相關資料</small></div>
                <div class="service-indicator"><span class="service-label">台服連線</span><strong id="game-health" data-state="pending">未知</strong><small>連線狀態不代表官方開服狀態，但關服時一定連不上</small></div>
            </aside>
            </div>

            <section id="captcha-panel" class="player-lookup-message captcha-panel" hidden
                aria-labelledby="captcha-title">
                <h2 id="captcha-title">需要驗證</h2>
                <p id="captcha-description">請完成驗證後重新送出查詢。</p>
                <img id="captcha-image" class="captcha-image" alt="驗證碼圖片" hidden>
                <label for="captcha-answer">驗證答案</label>
                <div class="player-lookup-input-row">
                    <input id="captcha-answer" type="text" autocomplete="off">
                    <button id="captcha-submit" type="button">送出驗證</button>
                </div>
            </section>

            <div id="lookup-progress" class="lookup-progress" role="progressbar" aria-label="正在查詢玩家資料" hidden>
                <span></span>
            </div>

            <p id="player-lookup-status" class="player-lookup-message" role="status" aria-live="polite"></p>

            <section id="player-result" class="player-result" aria-live="polite" hidden>
                <header class="player-result-heading">
                    <div class="player-identity">
                        <div class="player-identity-title"><h2 id="player-nickname">-</h2><span id="player-online" class="player-online-badge">-</span></div>
                        <div class="player-identity-meta"><span id="player-user-id" class="player-result-id">-</span><span id="player-server">-</span></div>
                    </div>
                </header>
                <div class="player-peak-modes">
                    <section class="player-peak-mode" aria-labelledby="sport-title">
                        <h3 id="sport-title">巔峰競技</h3>
                        <p>目前：<span id="sport-current-rank">-</span></p>
                        <p>最高：<span id="sport-highest-rank">-</span></p>
                        <p>勝率：<span id="win-rate">-</span></p>
                    </section>
                    <section class="player-peak-mode" aria-labelledby="wild-title">
                        <h3 id="wild-title">巔峰狂野</h3>
                        <p>目前：<span id="wild-current-rank">-</span></p>
                        <p>最高：<span id="wild-highest-rank">-</span></p>
                        <p>勝率：<span id="wild-win-rate">-</span></p>
                    </section>
                </div>
                <div class="player-bags">
                <section class="player-bag" aria-labelledby="primary-bag-title">
                    <h3 id="primary-bag-title">出戰</h3><div id="primary-pet">-</div>
                </section>
                <section class="player-bag" aria-labelledby="secondary-bag-title">
                    <h3 id="secondary-bag-title">待戰</h3><div id="secondary-pet">-</div>
                </section>
                </div>
            </section>
        </section>
    </main>

    <script type="module" src="./js/player-lookup.js"></script>
</body>

</html>
